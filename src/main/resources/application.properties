# Application
spring.application.name=routing
server.port=8989
server.address=127.0.0.1

# Jedis
redis.cluster.nodes=localhost:7000,localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005,localhost:7006,localhost:7007,localhost:7008,localhost:7009
redis.threadPool.maxTotal=60
redis.threadPool.maxIdle=50
redis.threadPool.minIdle=10
redis.threadPool.blockWhenExhausted=true
redis.connection.timeout=2000
redis.so.timeout=2000
redis.maxAttempts=20
redis.connection.user=
redis.connection.password=

# Websocket
websocket.server.enabled=true
websocket.server.host=localhost
websocket.server.port=8080
websocket.server.path=/ws
websocket.retry.intervalSeconds=10
websocket.header.name=Authorization
websocket.header.value=fcb13146-ecd7-46a5-b9cb-a1e75fae9bdc

# Related to the requests to the backend for notify the rating per service provider per second, the url must end with '/'
backend.url=http://localhost:8080/balance-credit/credit-used/
backend.apiKey=Cn62uZGdSUeGqmtVnHmI7iaji3C74bRd
backend.RequestFrequency=1000

# Threads
spring.threads.virtual.enabled=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.concurrency=30
spring.kafka.consumer.reconnect.backoff.ms=1000
spring.kafka.consumer.reconnect.backoff.max.ms=10000
spring.kafka.consumer.session.timeout.ms=30000
spring.kafka.consumer.heartbeat.interval.ms=10000
spring.kafka.producer.reconnect.backoff.ms=1000
spring.kafka.producer.reconnect.backoff.max.ms=10000

# Priority-based Kafka Listener Configuration
kafka.listener.high.concurrency=3
kafka.listener.medium.concurrency=2
kafka.listener.low.concurrency=1

# Scylla
scylla.contact.points=localhost:9042
scylla.datacenter=datacenter1
scylla.user=
scylla.password=

## mapping
# tlv to map prefix for SCCP called addr SRI just for SS7 with default -1 to disabled tlv mapping
tlv.sccp.called-addr.sri=-1

## Multipart message reference format: 8BIT (IEI 0x00, 6-byte UDH) or 16BIT (IEI 0x08, 7-byte UDH)
smsc.split.msg.reference.type=8BIT

## DLR encoding
# Default data coding for SMSC-generated DLRs (0 = GSM7, 3 = ISO-8859-1, 8 = UCS2)
smsc.default.dlr.data-coding=0
